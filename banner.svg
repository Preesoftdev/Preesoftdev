<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Preesoft - Engineering Resilient Digital Systems for Scale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05062b"/>
      <stop offset="0.55" stop-color="#0b0f6b"/>
      <stop offset="1" stop-color="#1a22b8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c7bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <!-- Brand mark (blocks inspired by the Preesoft logo) -->
  <g transform="translate(1000 24)">
    <circle cx="48" cy="48" r="46" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="110" y="2" width="130" height="92" rx="22" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="0" y="110" width="100" height="92" rx="10" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="110" y="110" width="130" height="92" rx="22" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="0" y="218" width="100" height="92" rx="14" fill="#ffffff" fill-opacity="0.35"/>
  </g>

  <!-- Text -->
  <text x="80" y="100" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#8fa0ff">PREESOFT</text>
  <text x="80" y="170" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Engineering Resilient</text>
  <text x="80" y="232" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff">Digital Systems for Scale</text>
  <rect x="80" y="256" width="180" height="5" rx="2.5" fill="url(#line)"/>
  <text x="80" y="306" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c7cdfa">Software · AI · Cloud · Cybersecurity  ·  Lahore, Pakistan</text>
</svg>
